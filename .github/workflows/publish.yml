name: Publish to GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/chenrui333/schema-registry-iam

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Installs the tool versions pinned in mise.toml (just, shellcheck,
      # hadolint, actionlint, zizmor).
      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Lint
        run: just lint

  # Builds and tests both architectures with a read-only token. The job id is
  # a required status check on main; keep it when renaming steps.
  build-and-publish:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify CP_DIGEST matches CP_VERSION
        run: |
          set -euo pipefail
          version=$(grep '^ARG CP_VERSION=' Dockerfile | cut -d= -f2)
          pinned=$(grep '^ARG CP_DIGEST=' Dockerfile | cut -d= -f2)
          live=$(docker buildx imagetools inspect "confluentinc/cp-schema-registry:${version}" \
            | awk '/^Digest:/ { print $2; exit }')
          if [[ "${pinned}" != "${live}" ]]; then
            echo "CP_DIGEST mismatch — update CP_DIGEST in Dockerfile to ${live}"
            echo "  Dockerfile: ${pinned}"
            echo "  Registry:   ${live}"
            exit 1
          fi
          echo "CP_DIGEST verified: ${pinned}"

      # Build amd64 image and load it for testing.
      - name: Build image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:test-amd64

      - name: Validate image (amd64)
        run: ./scripts/test-image.sh --skip-build ${{ env.IMAGE_NAME }}:test-amd64

      # Start Schema Registry against a local PLAINTEXT Kafka and use the
      # REST API. Runs natively on amd64 only; QEMU is too slow for two JVMs.
      - name: Runtime smoke test (amd64)
        run: ./scripts/test-runtime.sh "${IMAGE_NAME}:test-amd64"

      # Build arm64 image under QEMU and load it for testing.
      - name: Build image (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE_NAME }}:test-arm64

      - name: Validate image (arm64)
        run: ./scripts/test-image.sh --skip-build ${{ env.IMAGE_NAME }}:test-arm64

  # Push-only: pull request runs never receive a package-write token.
  publish:
    if: github.event_name == 'push'
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push latest/<sha> to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # main branch -> latest
            type=raw,value=latest,enable={{is_default_branch}}
            # always: short SHA
            type=sha,prefix=

      # Rebuilds from the same digest-pinned base and checksum-verified JAR.
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
